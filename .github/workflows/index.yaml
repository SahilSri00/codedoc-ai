name: CodeDoc-AI — Auto-Document on Push

on:
  # Allow a manual run from the Actions tab (useful when a change touches only
  # .github/**, which matches none of the paths filters below).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "**/*.py"
      - "**/*.java"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.go"
      - "**/*.rs"
      - "**/*.cpp"

permissions:
  contents: read   # read-only: this workflow no longer pushes commits

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for diff
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 2. Python + Poetry setup
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Poetry deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      # --------------------------------------------------
      # 3. Run tests
      # --------------------------------------------------
      - name: Run tests
        run: poetry run python -m pytest tests --maxfail=1 --disable-warnings -v

      # --------------------------------------------------
      # 4. Detect changed source files (diff-aware)
      # --------------------------------------------------
      - name: Get changed files
        id: changed
        run: |
          git diff --name-only HEAD~1 > all_changed.txt

          grep -E '\.(py|js|ts|java|rs|go|cpp|cc|hpp)$' all_changed.txt > relevant_files.txt || true

          FILE_COUNT=$(wc -l < relevant_files.txt | tr -d ' ')
          echo "count=$FILE_COUNT" >> $GITHUB_OUTPUT

          if [ "$FILE_COUNT" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📄 $FILE_COUNT file(s) to document:"
            cat relevant_files.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No source files changed — skipping doc generation"
          fi

      # --------------------------------------------------
      # 5. Generate docs for changed files only
      # --------------------------------------------------
      - name: Generate documentation
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mkdir -p docs/generated

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "📝 Generating docs for: $file"
              poetry run codedoc-ai generate "$file" --out docs/generated/ || echo "⚠️ Failed: $file"
            fi
          done < relevant_files.txt

      # --------------------------------------------------
      # 6. Publish generated docs as a build artifact
      #
      # NOTE: docs/generated/ is intentionally gitignored, so the docs are
      # published as a downloadable artifact rather than committed back to
      # main. An earlier "git add docs/generated/" step could never succeed —
      # git add exits 1 on an explicitly-ignored path.
      # --------------------------------------------------
      - name: Upload docs artifact
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codedoc-ai-docs
          path: docs/generated/
          retention-days: 90

      # --------------------------------------------------
      # 7. Job summary
      # --------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "### 📝 CodeDoc-AI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files changed:** ${{ steps.changed.outputs.count || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
