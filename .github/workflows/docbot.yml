name: CodeDoc-AI — PR Documentation

on:
  pull_request:
    paths:
      - "src/**"
      - "**/*.py"
      - "**/*.java"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.go"
      - "**/*.rs"
      - "**/*.cpp"

permissions:
  contents: write
  pull-requests: write

jobs:
  docbot:
    runs-on: ubuntu-latest
    # Skip duplicate runs when a PR is opened from the same repo
    if: github.event.pull_request.head.repo.full_name != github.repository || github.event_name == 'pull_request'

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      # --------------------------------------------------
      # 1. Checkout with enough history for git diff
      # --------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Python + Poetry setup
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Poetry deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      # --------------------------------------------------
      # 3. Run tests first (fail fast)
      # --------------------------------------------------
      - name: Run tests
        run: poetry run python -m pytest tests --maxfail=1 --disable-warnings -v

      # --------------------------------------------------
      # 4. Detect changed source files
      # --------------------------------------------------
      - name: Get changed files
        id: changed
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.sha }} > all_changed.txt

          # Filter to supported source extensions only
          grep -E '\.(py|js|ts|java|rs|go|cpp|cc|hpp)$' all_changed.txt > relevant_files.txt || true

          FILE_COUNT=$(wc -l < relevant_files.txt | tr -d ' ')
          echo "count=$FILE_COUNT" >> $GITHUB_OUTPUT

          if [ "$FILE_COUNT" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📄 $FILE_COUNT source file(s) changed:"
            cat relevant_files.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No supported source files changed"
          fi

      # --------------------------------------------------
      # 5. Generate docs for each changed file
      # --------------------------------------------------
      - name: Generate documentation
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mkdir -p docs/generated

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "📝 Generating docs for: $file"
              poetry run codedoc-ai generate "$file" --out docs/generated/ || echo "⚠️ Failed: $file"
            fi
          done < relevant_files.txt

      # --------------------------------------------------
      # 6. Build the PR comment body
      # --------------------------------------------------
      - name: Build PR comment
        if: steps.changed.outputs.has_changes == 'true'
        id: comment-body
        run: |
          {
            echo "body<<COMMENT_EOF"
            echo "## 📝 CodeDoc-AI — Documentation Preview"
            echo ""
            echo "**${{ steps.changed.outputs.count }} file(s) analyzed** from this PR."
            echo ""

            # Include generated docs content (truncated per file)
            for md_file in docs/generated/*.md; do
              if [ -f "$md_file" ]; then
                basename=$(basename "$md_file" .md)
                echo "<details>"
                echo "<summary>📄 <code>$basename</code></summary>"
                echo ""
                head -40 "$md_file"
                echo ""
                echo "</details>"
                echo ""
              fi
            done

            echo "---"
            echo "<sub>🤖 Auto-generated by <strong>CodeDoc-AI</strong> • Commit: ${{ github.sha }}</sub>"
            echo "COMMENT_EOF"
          } >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 7. Find existing bot comment (to update, not spam)
      # --------------------------------------------------
      - name: Find existing comment
        if: steps.changed.outputs.has_changes == 'true'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "CodeDoc-AI"

      # --------------------------------------------------
      # 8. Post or update the PR comment
      # --------------------------------------------------
      - name: Post PR comment
        if: steps.changed.outputs.has_changes == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: ${{ steps.comment-body.outputs.body }}
          edit-mode: replace

      # --------------------------------------------------
      # 9. Upload generated docs as build artifact
      # --------------------------------------------------
      - name: Upload docs artifact
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codedoc-ai-docs
          path: docs/generated/
          retention-days: 30
